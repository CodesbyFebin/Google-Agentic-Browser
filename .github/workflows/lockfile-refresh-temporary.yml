name: Temporary lockfile refresh (security upgrade branch)
on:
  push:
    branches:
      - fix/security-audit-next-phases-20261120
    paths:
      - .github/workflows/lockfile-refresh-temporary.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Regenerate root lockfile for patched dependency override
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify both lockfiles can be installed without changing them
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          (cd apps/ai-studio && npm ci --ignore-scripts --no-audit --no-fund)
      - name: Commit updated lockfile to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(deps): lock patched deepmerge-ts dependency"
            git push origin HEAD:fix/security-audit-next-phases-20261120
          fi
