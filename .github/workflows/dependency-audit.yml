name: Dependency audit

on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - apps/ai-studio/package.json
      - apps/ai-studio/package-lock.json
      - .github/workflows/dependency-audit.yml
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit ${{ matrix.application }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - application: root
            directory: .
          - application: ai-studio
            directory: apps/ai-studio
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit production dependencies
        working-directory: ${{ matrix.directory }}
        run: npm audit --omit=dev --audit-level=high
